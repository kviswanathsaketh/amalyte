name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (Turborepo — only rebuilds affected apps/packages)
        run: pnpm build

      # SCA / dependency scanning — spec §6.4. Wire in Snyk or Dependabot
      # token once the repo is live; placeholder step kept visible here
      # so this isn't silently skipped.
      - name: Dependency scan (placeholder — add SNYK_TOKEN secret)
        run: echo "TODO: pnpm dlx snyk test"
